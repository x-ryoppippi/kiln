name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy docs to Cloudflare Workers
    # A manual run from another branch must not replace the published site.
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
      - run: nix develop --command just install
      - run: nix develop --command vp run --filter docs build
      # CI already builds the site on pull requests; until the secrets exist there is nowhere to deploy to.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: docs
        env:
          WRANGLER_SEND_METRICS: "false"
        run: nix develop --command bunx wrangler@4.156.1 deploy
