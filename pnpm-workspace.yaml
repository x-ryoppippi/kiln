packages:
  - packages/*
  - examples/*
  - docs

minimumReleaseAge: 2880
# Cloudflare's CLI release candidate and the runtime it ships with, published the day the docs moved to it; exact
# versions, so the exemption covers nothing later.
minimumReleaseAgeExclude:
  - "cf@1.0.0-rc.0"
  - "@cloudflare/build-output-utils@1.0.0-rc.0"
  - "@cloudflare/config@1.0.0-rc.0"
  - "@cloudflare/runtime-types@0.1.29"
  - "miniflare@5.20261116.0-beta"
  - "workerd@1.20261116.1"
  - "@cloudflare/workerd-darwin-64@1.20261116.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261116.1"
  - "@cloudflare/workerd-linux-64@1.20261116.1"
  - "@cloudflare/workerd-linux-arm64@1.20261116.1"
  - "@cloudflare/workerd-windows-64@1.20261116.1"

# Security settings for supply chain attack prevention
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade

# Their install scripts only verify the platform binary that optional dependencies already installed.
allowBuilds:
  esbuild: false
  "@swc/core": false
  workerd: false
  # Its postinstall only prints a funding banner.
  core-js: false

shellEmulator: true

# Nix pins pnpm for local development and CI, so pnpm should not download a
# second package-manager binary or add its bootstrap metadata to the lockfile.
pmOnFail: ignore

autoDedupe: true

# Vite+ provides `vite` as @voidzero-dev/vite-plus-core, versioned with Vite+
# rather than Vite, so peer ranges on `vite` never match it.
peerDependencyRules:
  allowedVersions:
    vite: "*"

overrides:
  # Listed as a dependency but never imported; it pins a chromium-bidi release without provenance.
  "@ox-content/vite-plugin>puppeteer": "-"
